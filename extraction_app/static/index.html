<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PGG Paper Extraction</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --sidebar-w: 290px;
  --form-w: 350px;
  --bg: #f4f4f5;
  --surface: #fff;
  --border: #e4e4e7;
  --accent: #2563eb;
  --accent-h: #1d4ed8;
  --accent-lt: #eff6ff;
  --done: #16a34a;
  --done-lt: #f0fdf4;
  --text: #18181b;
  --muted: #71717a;
  --danger: #dc2626;
  --warn: #d97706;
}

*, body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; color: var(--text); }
body { background: var(--bg); height: 100vh; display: flex; flex-direction: column; overflow: hidden; }

/* ── Topbar ── */
#topbar {
  background: #1e3a8a;
  color: #fff;
  height: 46px;
  padding: 0 14px;
  display: flex;
  align-items: center;
  gap: 8px;
  flex-shrink: 0;
  box-shadow: 0 2px 8px rgba(0,0,0,.22);
  z-index: 10;
}
#topbar h1 { font-size: 14px; font-weight: 700; color: #fff; flex: 1; }
#topbar-pos { font-size: 11px; color: rgba(255,255,255,.65); white-space: nowrap; min-width: 90px; }
#status-msg { font-size: 11px; color: rgba(255,255,255,.7); min-width: 70px; }
.top-btn {
  background: rgba(255,255,255,.14);
  border: 1px solid rgba(255,255,255,.2);
  color: #fff;
  padding: 5px 11px;
  border-radius: 5px;
  cursor: pointer;
  font-size: 12px;
  font-weight: 500;
  white-space: nowrap;
  transition: background .12s;
}
.top-btn:hover { background: rgba(255,255,255,.24); }

/* ── Layout ── */
#main { display: flex; flex: 1; overflow: hidden; }

/* ── Sidebar ── */
#sidebar {
  width: var(--sidebar-w);
  background: var(--surface);
  border-right: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  flex-shrink: 0;
}
#search-wrap { padding: 9px 9px 6px; border-bottom: 1px solid var(--border); }
#search {
  width: 100%; padding: 6px 10px; border: 1px solid var(--border);
  border-radius: 5px; font-size: 12px; outline: none; background: var(--bg);
}
#search:focus { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent-lt); }

#paper-count {
  padding: 4px 10px;
  font-size: 10.5px;
  color: var(--muted);
  border-bottom: 1px solid var(--border);
}
.prog-bar-wrap { height: 3px; background: var(--border); }
.prog-bar { height: 3px; background: var(--done); transition: width .4s; }

#paper-list { flex: 1; overflow-y: auto; }

.paper-item {
  padding: 8px 10px 7px;
  cursor: pointer;
  border-left: 3px solid transparent;
  border-bottom: 1px solid #f0f0f0;
  display: flex;
  gap: 8px;
  align-items: flex-start;
  transition: background .08s;
  user-select: none;
}
.paper-item:hover { background: var(--bg); }
.paper-item.active { background: var(--accent-lt); border-left-color: var(--accent); }
.paper-item.done   { background: var(--done-lt); }
.paper-item.done.active { background: #dbeafe; }
.paper-item.no-pdf { opacity: .5; }

.pi-left { display: flex; flex-direction: column; align-items: center; gap: 5px; flex-shrink: 0; padding-top: 2px; }
.paper-num { font-size: 10px; color: var(--muted); font-variant-numeric: tabular-nums; }
.paper-dot { width: 7px; height: 7px; border-radius: 50%; background: #d4d4d8; }
.paper-item.done .paper-dot { background: var(--done); }

.pi-right { min-width: 0; }
.pi-title {
  font-size: 11.5px; font-weight: 600; line-height: 1.35;
  overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
}
.pi-sub {
  font-size: 10px; color: var(--muted); margin-top: 2px;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.no-pdf-badge {
  display: inline-block; font-size: 9px; background: #fef3c7; color: #92400e;
  border: 1px solid #fde68a; border-radius: 3px; padding: 0 4px; margin-left: 4px;
  vertical-align: middle; font-weight: 600;
}

.no-results { padding: 24px; text-align: center; color: var(--muted); font-size: 13px; }

#sidebar-footer {
  padding: 7px 10px;
  border-top: 1px solid var(--border);
  background: #fafafa;
  font-size: 10px;
  color: #a1a1aa;
  line-height: 1.6;
}
#sidebar-footer kbd {
  background: #e4e4e7; border-radius: 3px; padding: 0 4px;
  font-size: 10px; font-family: inherit; color: #52525b;
}

/* ── PDF Viewer ── */
#viewer {
  flex: 1;
  display: flex;
  flex-direction: column;
  background: #525659;
  border-right: 1px solid var(--border);
  overflow: hidden;
  position: relative;
}

#pdf-frame {
  flex: 1;
  width: 100%;
  height: 100%;
  border: none;
  display: block;
}

#pdf-placeholder {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 10px;
  color: #aaa;
}
#pdf-placeholder .ph-icon { font-size: 48px; }
#pdf-placeholder .ph-title { font-size: 15px; font-weight: 600; color: #ccc; }
#pdf-placeholder .ph-sub { font-size: 12px; color: #999; text-align: center; max-width: 320px; line-height: 1.6; }
#pdf-placeholder code {
  background: #3a3d40; color: #e0e0e0; padding: 2px 7px;
  border-radius: 4px; font-size: 11px; font-family: 'Menlo','Monaco',monospace;
}

/* ── Form panel ── */
#form-panel {
  width: var(--form-w);
  background: var(--surface);
  display: flex;
  flex-direction: column;
  flex-shrink: 0;
  overflow: hidden;
}
#form-header {
  padding: 10px 12px 8px;
  border-bottom: 1px solid var(--border);
  background: #fafafa;
}
#form-paper-label {
  font-size: 11px; color: var(--muted);
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  margin-bottom: 7px;
}
#condition-tabs { display: flex; gap: 4px; flex-wrap: wrap; align-items: center; }

.cond-tab {
  padding: 3px 9px; border-radius: 4px; font-size: 11px; cursor: pointer;
  border: 1px solid var(--border); background: white; font-weight: 500;
  color: var(--muted); transition: all .1s; max-width: 120px;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.cond-tab:hover { border-color: var(--accent); color: var(--accent); }
.cond-tab.active { background: var(--accent); color: white; border-color: var(--accent); }

#add-cond-btn {
  font-size: 11px; padding: 3px 8px; background: none;
  border: 1px dashed #d4d4d8; border-radius: 4px; cursor: pointer;
  color: var(--accent); font-weight: 500;
}
#add-cond-btn:hover { background: var(--accent-lt); border-style: solid; }
#del-cond-btn {
  font-size: 11px; padding: 3px 7px; background: none; border: none;
  cursor: pointer; color: var(--danger); margin-left: auto; opacity: .65;
}
#del-cond-btn:hover { opacity: 1; }

#form-body { flex: 1; overflow-y: auto; padding: 10px 12px 14px; }

.section-label {
  font-size: 9.5px; font-weight: 700; text-transform: uppercase; letter-spacing: 1px;
  color: #a1a1aa; padding: 10px 0 5px; border-bottom: 1px solid var(--border); margin-bottom: 8px;
}
.field-group { margin-bottom: 9px; }
.field-label {
  font-size: 11px; font-weight: 600; color: #52525b; margin-bottom: 4px;
  display: flex; justify-content: space-between; align-items: baseline;
}
.field-hint { font-size: 10px; font-weight: 400; color: var(--muted); font-style: italic; }

/* Locked (non-empirical) fields */
.field-group.locked { opacity: .45; pointer-events: none; }
.na-badge {
  display: inline-block; margin-left: 8px; font-size: 9px; font-weight: 700;
  text-transform: uppercase; letter-spacing: .5px;
  background: #fef9c3; color: #854d0e; border: 1px solid #fde047;
  border-radius: 3px; padding: 0 5px; vertical-align: middle;
}

.tog-row { display: flex; gap: 3px; }
.tog {
  flex: 1; padding: 6px 2px; border: 1px solid var(--border);
  background: var(--bg); border-radius: 4px; cursor: pointer;
  font-size: 12px; font-weight: 600; text-align: center; color: #52525b;
  transition: all .1s;
}
.tog:hover { border-color: var(--accent); color: var(--accent); background: var(--accent-lt); }
.tog.on  { background: var(--accent); color: white; border-color: var(--accent); }
.tog.na  { background: #71717a; color: white; border-color: #71717a; }

.finput {
  width: 100%; padding: 6px 9px; border: 1px solid var(--border);
  border-radius: 4px; font-size: 12.5px; outline: none;
  background: var(--bg); color: var(--text); font-family: inherit;
}
.finput:focus { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent-lt); background: white; }
textarea.finput { resize: vertical; min-height: 54px; line-height: 1.5; }
.finput-sub { margin-top: 4px; font-size: 12px; }

#form-footer {
  padding: 9px 12px; border-top: 1px solid var(--border);
  display: flex; gap: 7px; background: #fafafa;
}
.save-btn {
  flex: 1; padding: 8px; background: var(--accent); color: white;
  border: none; border-radius: 5px; cursor: pointer;
  font-size: 13px; font-weight: 600; transition: background .12s;
}
.save-btn:hover  { background: var(--accent-h); }
.save-btn.saved  { background: var(--done); }
.save-btn.dirty  { background: var(--warn); }

/* Scrollbar */
::-webkit-scrollbar { width: 5px; height: 5px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: #d4d4d8; border-radius: 10px; }
::-webkit-scrollbar-thumb:hover { background: #a1a1aa; }

/* ── Field definition tooltip ── */
.field-label { cursor: default; }
#field-tip {
  display: none;
  position: fixed;
  background: #1e3a8a; color: #fff;
  padding: 9px 12px; border-radius: 7px;
  font-size: 11.5px; line-height: 1.55; font-weight: 400;
  max-width: 270px; z-index: 9999;
  box-shadow: 0 4px 18px rgba(0,0,0,.28);
  pointer-events: none;
}
</style>
</head>
<body>

<div id="topbar">
  <h1>PGG Paper Extraction</h1>
  <span id="topbar-pos"></span>
  <span id="status-msg"></span>
  <button class="top-btn" onclick="openGuide()">📖 Extraction Guide</button>
  <button class="top-btn" onclick="exportCSV()">⬇ Export CSV</button>
</div>

<div id="main">

  <!-- ── Sidebar ── -->
  <div id="sidebar">
    <div id="search-wrap">
      <input id="search" type="text" placeholder="Search by title or DOI…"
             oninput="filterPapers()" autocomplete="off" spellcheck="false">
    </div>
    <div id="paper-count"></div>
    <div class="prog-bar-wrap"><div class="prog-bar" id="prog-bar" style="width:0%"></div></div>
    <div id="paper-list"></div>
    <div id="sidebar-footer">
      <kbd>← →</kbd> or <kbd>J</kbd><kbd>K</kbd> navigate &nbsp;·&nbsp; <kbd>S</kbd> save
    </div>
  </div>

  <!-- ── PDF Viewer ── -->
  <div id="viewer">
    <iframe id="pdf-frame" style="display:none"></iframe>
    <div id="pdf-placeholder">
      <div class="ph-icon">📄</div>
      <div class="ph-title">No paper selected</div>
      <div class="ph-sub">
        Select a paper from the list.<br>
        Drop your PDF files into<br>
        <code>extraction_app/pdfs/</code>
      </div>
    </div>
  </div>

  <!-- ── Extraction Form ── -->
  <div id="form-panel">
    <div id="form-header">
      <div id="form-paper-label">No paper selected</div>
      <div id="condition-tabs"></div>
    </div>
    <div id="form-body">
      <div style="display:flex;align-items:center;justify-content:center;height:180px;color:var(--muted);font-size:12px">
        Select a paper to begin
      </div>
    </div>
    <div id="form-footer" style="display:none">
      <button class="save-btn" id="save-btn" onclick="saveNow()">Save</button>
    </div>
  </div>

</div>

<script>
/* ═══════════════════════════════════════════════════
   FIELDS  (matches Human Extraction Guide exactly)
═══════════════════════════════════════════════════ */
const FIELDS = [
  { sec: "Study Type" },
  { key:"Empirical",
    label:"Empirical",
    type:"bin",
    hint:"1 = has human participants · 0 = theory / simulation" },
  { key:"Controlled_Or_Observational",
    label:"Observational / Experimental",
    type:"bin_na",
    hint:"1 = controlled experiment with manipulation · 0 = observational · N/A = non-empirical" },
  { key:"Lab_Or_Field",
    label:"Lab / Field",
    type:"bin_na",
    hint:"1 = field experiment · 0 = lab or online · N/A = non-empirical" },

  { sec: "Game Configuration (CONFIG_)" },
  { key:"CONFIG_playerCount",
    label:"Group Size",
    type:"text",
    hint:"# players per group · typical range 2–20" },
  { key:"CONFIG_numRounds",
    label:"Game Length",
    type:"text",
    hint:"number of rounds · 1–30 · N/R if unknown or hidden" },
  { key:"CONFIG_allOrNothing",
    label:"Contribution Type",
    type:"bin",
    hint:"1 = continuous (any amount) · 0 = binary (all-or-nothing)" },
  { key:"CONFIG_defaultContribProp",
    label:"Contribution Framing",
    type:"bin_na_v",
    hint:"0 = opt-in (starts in private account) · 1 = opt-out (starts in public fund)" },
  { key:"CONFIG_MPCR",
    label:"MPCR",
    type:"text",
    hint:"fund multiplier ÷ group size · typical range 0.06–0.7" },
  { key:"CONFIG_chat",
    label:"Communication",
    type:"bin_na",
    hint:"1 = enabled · 0 = explicitly disabled · N/A = not mentioned" },
  { key:"CONFIG_showOtherSummaries",
    label:"Peer Outcome Visibility",
    type:"bin",
    hint:"1 = others' payoffs/earnings visible · 0 = hidden" },
  { key:"CONFIG_showNRounds",
    label:"Horizon Knowledge",
    type:"bin_na",
    hint:"1 = total/remaining rounds known to participants · N/A = not stated" },
  { key:"CONFIG_punishmentExists",
    label:"Punishment",
    type:"bin_na",
    hint:"1 = enabled in this condition · 0 = explicitly disabled · N/A = not described" },
  { key:"CONFIG_punishmentCost",
    label:"Punishment Cost",
    type:"text",
    hint:"coins per unit punishment assigned · 1–4 · N/A if no punishment · N/R if unstated" },
  { key:"CONFIG_punishmentTech",
    label:"Punishment Technology",
    type:"text",
    hint:"target loss per punisher coin spent (magnitude ÷ cost) · N/A if no punishment" },
  { key:"CONFIG_showPunishmentId",
    label:"Punisher Anonymity",
    type:"bin_na",
    hint:"1 = identity revealed · 0 = anonymous · N/A = no punishment in condition" },
  { key:"CONFIG_rewardExists",
    label:"Reward",
    type:"bin_na",
    hint:"1 = enabled · 0 = explicitly disabled · N/A = not mentioned (silence → N/A)" },
  { key:"CONFIG_rewardCost",
    label:"Reward Cost",
    type:"text",
    hint:"coins per unit reward given · N/A if no reward · N/R if unstated" },
  { key:"CONFIG_rewardTech",
    label:"Reward Technology",
    type:"text",
    hint:"recipient gain per rewarder coin (magnitude ÷ cost) · N/A if no reward" },
  { key:"CONFIG_showRewardId",
    label:"Rewarder Anonymity",
    type:"bin_na",
    hint:"1 = identity revealed · 0 = anonymous · N/A = no reward in condition" },

  { sec: "Notes" },
  { key:"Misc",
    label:"Misc / Source Notes",
    type:"area",
    hint:"table/figure refs, edge cases, ambiguities" },
];

/* ═══════════════════════════════════════════════════
   FIELD DEFINITIONS  (shown on hover)
═══════════════════════════════════════════════════ */
const FIELD_DEFS = {
  "Empirical":                  "1 = has human participants. 0 = theory, simulation, or analytical model with no human subjects.",
  "Controlled_Or_Observational":"1 = controlled experiment with an explicit manipulation. 0 = observational study (no manipulation).",
  "Lab_Or_Field":               "1 = real-world field experiment. 0 = lab or online. If 1, all CONFIG_ fields are auto-set to N/A.",
  "CONFIG_playerCount":         "Number of decision-makers in ONE group — not total participants. When teams send a representative, count teams. Typical range: 2–20.",
  "CONFIG_numRounds":           "Total rounds in the game. N/R if not reported or if the count is unknown/hidden from participants.",
  "CONFIG_allOrNothing":        "1 = continuous contributions (players choose any specific amount). 0 = binary choice only (all or nothing / cooperate-defect). ⚠ 1 means continuous — the name is counterintuitive.",
  "CONFIG_defaultContribProp":  "Starting position of the endowment. 0 = opt-in: starts in private account (standard PGG). 1 = opt-out: starts in public fund.",
  "CONFIG_MPCR":                "Marginal per capita return = fund multiplier ÷ group size. Typical range 0.06–0.7.",
  "CONFIG_chat":                "1 = free communication explicitly enabled. 0 = explicitly prohibited. N/A = not mentioned anywhere in the paper. Silence → N/A, not 0.",
  "CONFIG_showOtherSummaries":  "1 = participants see others' individual payoffs/earnings after each round. 0 = only contributions or group totals shown. Seeing contributions ≠ seeing payoffs.",
  "CONFIG_showNRounds":         "1 = total or remaining rounds explicitly displayed to participants. N/A = not stated. Do not infer from fixed rounds or 'common knowledge'.",
  "CONFIG_punishmentExists":    "1 = punishment mechanism in this condition. 0 = explicitly absent. N/A = not described. Code per condition independently — do not infer from other conditions.",
  "CONFIG_punishmentCost":      "Tokens spent by the punisher per unit of punishment assigned to the target. Typical range 1–4. N/A if no punishment. N/R if cost not explicitly stated.",
  "CONFIG_punishmentTech":      "Target's payoff loss per coin punisher spends = punishmentMagnitude ÷ punishmentCost. E.g., spend 1 coin, target loses 3 → value is 3. N/A if no punishment in this condition.",
  "CONFIG_showPunishmentId":    "1 = the punished player can identify who punished them. 0 = anonymous. N/A = no punishment in this condition, or paper doesn't address identity.",
  "CONFIG_rewardExists":        "1 = reward mechanism clearly described. 0 = explicitly ruled out. N/A = not mentioned. Silence → N/A, not 0.",
  "CONFIG_rewardCost":          "Tokens spent by the rewarder per unit of reward given. N/A if no reward. N/R if cost not explicitly stated.",
  "CONFIG_rewardTech":          "Recipient's gain per coin the rewarder spends = rewardMagnitude ÷ rewardCost. E.g., spend 1 coin, recipient gains 3 → value is 3. N/A if no reward.",
  "CONFIG_showRewardId":        "1 = the reward recipient can identify who rewarded them. 0 = anonymous. N/A = no reward in this condition, or paper doesn't address identity.",
  "Misc":                       "Free text: source table/figure references, edge cases, ambiguities, anything that doesn't fit the structured fields.",
};

/* ═══════════════════════════════════════════════════
   CONSTANTS
═══════════════════════════════════════════════════ */
const AUTO_NA_KEYS = new Set(
  FIELDS.filter(f => f.key && (f.key.startsWith("CONFIG_") || f.key.startsWith("DV_")))
        .map(f => f.key)
);

/* ═══════════════════════════════════════════════════
   STATE
═══════════════════════════════════════════════════ */
let allPapers      = [];
let filtered       = [];
let curIdx         = -1;
let curCond        = 0;
let store          = {};
let dirty          = false;
let saveTimer      = null;
let statusTimer    = null;
let filterTimer    = null;
let _activePaperId = null;

/* ═══════════════════════════════════════════════════
   INIT
═══════════════════════════════════════════════════ */
async function init() {
  const r   = await fetch("/api/papers");
  allPapers = await r.json();
  filtered  = [...allPapers];
  renderList();
  updateMeta();
}

/* ═══════════════════════════════════════════════════
   PAPER LIST
═══════════════════════════════════════════════════ */
function renderList() {
  const el = document.getElementById("paper-list");
  if (filtered.length === 0) {
    el.innerHTML = `<div class="no-results">No papers match your search</div>`;
    return;
  }
  el.innerHTML = filtered.map((p, i) => {
    const title  = p.title || p.id;
    const sub    = p.title ? (p.year ? `${p.id} · ${p.year}` : p.id) : "";
    const noPdf  = !p.has_pdf;
    const badge  = noPdf ? `<span class="no-pdf-badge">no PDF</span>` : "";
    return `
    <div class="paper-item ${p.done ? "done" : ""} ${i === curIdx ? "active" : ""} ${noPdf ? "no-pdf" : ""}"
         data-pid="${esc(p.id)}" onclick="selectPaper(${i})">
      <div class="pi-left">
        <span class="paper-num">${i + 1}</span>
        <span class="paper-dot"></span>
      </div>
      <div class="pi-right">
        <div class="pi-title" title="${esc(title)}">${esc(title)}${badge}</div>
        ${sub ? `<div class="pi-sub">${esc(sub)}</div>` : ""}
      </div>
    </div>`;
  }).join("");
}

function filterPapers() {
  clearTimeout(filterTimer);
  filterTimer = setTimeout(_doFilter, 150);
}

function _doFilter() {
  const q      = document.getElementById("search").value.toLowerCase().trim();
  const prevId = curIdx >= 0 ? filtered[curIdx]?.id : null;

  filtered = q
    ? allPapers.filter(p =>
        p.id.toLowerCase().includes(q) ||
        (p.title   || "").toLowerCase().includes(q) ||
        (p.authors || "").toLowerCase().includes(q))
    : [...allPapers];

  curIdx = prevId ? filtered.findIndex(p => p.id === prevId) : -1;

  renderList();
  updateMeta();
}

function updateMeta() {
  const done  = allPapers.filter(p => p.done).length;
  const total = allPapers.length;
  const pdfs  = allPapers.filter(p => p.has_pdf).length;
  document.getElementById("paper-count").textContent =
    `${filtered.length} / ${total} · ${pdfs} PDFs · ${done} done`;
  document.getElementById("prog-bar").style.width =
    total ? `${(done / total) * 100}%` : "0%";
}

function scrollActive() {
  document.querySelector(".paper-item.active")?.scrollIntoView({ block: "nearest" });
}

/* ═══════════════════════════════════════════════════
   SELECT PAPER
═══════════════════════════════════════════════════ */
async function selectPaper(idx) {
  if (idx < 0 || idx >= filtered.length) return;

  // Save current paper before leaving
  clearTimeout(saveTimer);
  if (_activePaperId) await flushSave(_activePaperId);

  curIdx         = idx;
  curCond        = 0;
  dirty          = false;
  _activePaperId = filtered[idx].id;

  renderList();
  scrollActive();
  updatePositionLabel();

  const p = filtered[idx];

  // Update form header
  document.getElementById("form-paper-label").textContent =
    p.title ? `${p.title} (${p.year || p.id})` : p.id;

  // Load PDF or show placeholder
  const frame       = document.getElementById("pdf-frame");
  const placeholder = document.getElementById("pdf-placeholder");

  if (p.has_pdf) {
    frame.src = `/pdf/${encodeURIComponent(p.id)}`;
    frame.style.display = "block";
    placeholder.style.display = "none";
  } else {
    frame.src = "";
    frame.style.display = "none";
    placeholder.style.display = "flex";
    placeholder.innerHTML = `
      <div class="ph-icon">📄</div>
      <div class="ph-title">PDF not available</div>
      <div class="ph-sub">
        Add the file<br>
        <code>${esc(p.id)}.pdf</code><br>
        to <code>extraction_app/pdfs/</code><br>
        then reload the page.
      </div>`;
  }

  // Load extraction data
  const exR = await fetch(`/api/extraction/${encodeURIComponent(p.id)}`);
  const ex  = await exR.json();
  store[p.id] = (ex && Array.isArray(ex.conditions) && ex.conditions.length)
    ? ex
    : { conditions: [blankCond(0)] };

  renderTabs();
  renderForm();
  setSaveBtn("idle");
  document.getElementById("form-footer").style.display = "flex";
}

function updatePositionLabel() {
  document.getElementById("topbar-pos").textContent =
    curIdx >= 0 ? `Paper ${curIdx + 1} / ${filtered.length}` : "";
}

/* ═══════════════════════════════════════════════════
   CONDITIONS
═══════════════════════════════════════════════════ */
function blankCond(n) { return { label: `Condition ${n}` }; }

function curData() {
  return (_activePaperId && store[_activePaperId]) ? store[_activePaperId] : null;
}

function curCondObj() {
  const d = curData();
  return d ? (d.conditions[curCond] || {}) : {};
}

function renderTabs() {
  const d = curData();
  if (!d) return;
  if (isNonEmpirical()) {
    document.getElementById("condition-tabs").innerHTML =
      `<span style="font-size:11px;color:#a1a1aa;font-style:italic">non-empirical — single entry</span>`;
    return;
  }
  document.getElementById("condition-tabs").innerHTML =
    d.conditions.map((c, i) => `
      <span class="cond-tab ${i === curCond ? "active" : ""}" onclick="switchCond(${i})"
            title="${esc(c.label || "Condition " + i)}">${esc(c.label || "Cond " + i)}</span>
    `).join("") +
    `<button id="add-cond-btn" onclick="addCond()">+ Cond</button>` +
    (d.conditions.length > 1
      ? `<button id="del-cond-btn" onclick="delCond()">✕</button>`
      : "");
}

function switchCond(i) { curCond = i; renderTabs(); renderForm(); }

function addCond() {
  const d = curData(); if (!d) return;
  d.conditions.push(blankCond(d.conditions.length));
  curCond = d.conditions.length - 1;
  renderTabs(); renderForm(); markDirty();
}

function delCond() {
  const d = curData(); if (!d || d.conditions.length <= 1) return;
  if (!confirm(`Delete "${d.conditions[curCond].label || "this condition"}"?`)) return;
  d.conditions.splice(curCond, 1);
  curCond = Math.max(0, curCond - 1);
  renderTabs(); renderForm(); markDirty();
}

/* ═══════════════════════════════════════════════════
   FORM RENDERING
═══════════════════════════════════════════════════ */
function isNonEmpirical() {
  return curCondObj()["Empirical"] === "0";
}

function shouldLockParams() {
  const c = curCondObj();
  return c["Empirical"] === "0" || c["Lab_Or_Field"] === "1";
}

function renderForm() {
  const c        = curCondObj();
  const nonEmp   = isNonEmpirical();
  const lockCfg  = shouldLockParams();

  // Condition label is meaningless for non-empirical papers
  let html = nonEmp
    ? ""
    : fieldHTML({ key: "label", label: "Condition Label", type: "text", hint: "" }, c.label || "");

  for (const f of FIELDS) {
    if (f.sec) {
      const isGameSec  = f.sec.startsWith("Game");
      const isStudySec = f.sec.startsWith("Study");
      const badge =
        (lockCfg && isGameSec) || (nonEmp && isStudySec)
          ? `<span class="na-badge">auto N/A</span>` : "";
      html += `<div class="section-label">${f.sec}${badge}</div>`;
      continue;
    }
    const val          = c[f.key] !== undefined ? c[f.key] : "";
    const isStudyField = f.key === "Controlled_Or_Observational" || f.key === "Lab_Or_Field";
    html += fieldHTML(f, val, (AUTO_NA_KEYS.has(f.key) && lockCfg) || (isStudyField && nonEmp));
  }
  document.getElementById("form-body").innerHTML = html;
}

function fieldHTML(f, val, locked = false) {
  val = (val === null || val === undefined) ? "" : String(val);
  const hint = f.hint ? `<span class="field-hint">${esc(f.hint)}</span>` : "";
  let body;

  if (f.type === "bin") {
    body = togRow(f.key, val, [
      { v: "0", lbl: "0 — No" },
      { v: "1", lbl: "1 — Yes" },
    ]);
  } else if (f.type === "bin_na") {
    body = togRow(f.key, val, [
      { v: "0",   lbl: "0" },
      { v: "1",   lbl: "1" },
      { v: "N/A", lbl: "N/A", na: true },
    ]);
  } else if (f.type === "bin_na_v") {
    const freeVal = !["0", "1", "N/A"].includes(val) ? val : "";
    body = togRow(f.key, val, [
      { v: "0",   lbl: "0" },
      { v: "1",   lbl: "1" },
      { v: "N/A", lbl: "N/A", na: true },
    ]) + `<input class="finput finput-sub" type="text"
            placeholder="or intermediate value e.g. 0.5"
            value="${esc(freeVal)}"
            data-key="${f.key}"
            oninput="onFreeInput(this)"
            onchange="onFreeInput(this)">`;
  } else if (f.type === "select") {
    const opts = (f.options || []).map(o =>
      `<option value="${esc(o)}"${val === o ? " selected" : ""}>${esc(o)}</option>`
    ).join("");
    body = `<select class="finput" data-key="${f.key}"
              onchange="setVal('${f.key}',this.value)">
              <option value="">— select —</option>${opts}
            </select>`;
  } else if (f.type === "area") {
    body = `<textarea class="finput" rows="3"
              data-key="${f.key}"
              onchange="setVal('${f.key}',this.value)"
              oninput="setVal('${f.key}',this.value)">${esc(val)}</textarea>`;
  } else {
    body = `<input class="finput" type="text" value="${esc(val)}"
              data-key="${f.key}"
              onchange="setVal('${f.key}',this.value)"
              oninput="setVal('${f.key}',this.value)">`;
  }

  const tipAttr = FIELD_DEFS[f.key]
    ? `data-tip="${esc(FIELD_DEFS[f.key])}" onmouseenter="showTip(this)" onmouseleave="hideTip()"`
    : "";
  const wrap = locked ? ` locked` : "";
  return `<div class="field-group${wrap}" data-field="${f.key || "label"}">
    <div class="field-label" ${tipAttr}>${esc(f.label || "Label")} ${hint}</div>
    ${body}
  </div>`;
}

function togRow(key, curVal, opts) {
  return `<div class="tog-row" data-tog-key="${key}">` +
    opts.map(o => {
      const sel = String(curVal) === String(o.v);
      const cls = sel ? (o.na ? "tog na" : "tog on") : "tog";
      return `<button class="${cls}" data-val="${esc(o.v)}"
                onclick="onToggle(this,'${key}')">${esc(o.lbl)}</button>`;
    }).join("") +
  `</div>`;
}

/* ═══════════════════════════════════════════════════
   INPUT HANDLERS
═══════════════════════════════════════════════════ */
function onToggle(btn, key) {
  const row = btn.closest(".tog-row");
  row.querySelectorAll(".tog").forEach(b => b.classList.remove("on", "na"));
  btn.classList.add(["N/A", "N/R"].includes(btn.dataset.val) ? "na" : "on");
  setVal(key, btn.dataset.val);
  const ft = btn.closest(".field-group").querySelector("input.finput-sub");
  if (ft) ft.value = "";
}

function onFreeInput(input) {
  input.closest(".field-group").querySelectorAll(".tog").forEach(b =>
    b.classList.remove("on", "na")
  );
  setVal(input.dataset.key, input.value);
}

function setVal(key, value) {
  const d = curData(); if (!d || !d.conditions[curCond]) return;
  d.conditions[curCond][key] = value;
  if (key === "label") renderTabs();
  if (key === "Empirical" || key === "Lab_Or_Field") {
    if (shouldLockParams()) autoFillNA(); else renderForm();
    if (key === "Empirical") renderTabs();
  }
  markDirty();
}

function autoFillNA() {
  const d = curData(); if (!d || !d.conditions[curCond]) return;
  const c = d.conditions[curCond];
  for (const key of AUTO_NA_KEYS) c[key] = "N/A";
  if (c["Empirical"] === "0") {
    c["Controlled_Or_Observational"] = "N/A";
    c["Lab_Or_Field"] = "N/A";
  }
  renderForm();
}

/* ═══════════════════════════════════════════════════
   DIRTY / SAVE STATE
═══════════════════════════════════════════════════ */
function markDirty() {
  dirty = true;
  setSaveBtn("dirty");
  clearTimeout(saveTimer);
  const pid = _activePaperId;
  saveTimer = setTimeout(() => {
    if (_activePaperId === pid) autoSave();
  }, 2000);
}

async function autoSave() {
  if (!dirty || !_activePaperId) return;
  await flushSave(_activePaperId);
  dirty = false;
  setSaveBtn("idle");
  showStatus("Auto-saved");
}

async function saveNow() {
  clearTimeout(saveTimer);
  if (!_activePaperId) return;
  await flushSave(_activePaperId);
  dirty = false;
  setSaveBtn("saved");
  setTimeout(() => setSaveBtn("idle"), 1600);
}

async function flushSave(pid) {
  const d = store[pid]; if (!d) return;
  await fetch(`/api/extraction/${encodeURIComponent(pid)}`, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(d),
  });
  const anyFilled = d.conditions.some(c =>
    Object.entries(c).some(([k, v]) => k !== "label" && v !== "" && v !== null)
  );
  const p = allPapers.find(x => x.id === pid);
  if (p && p.done !== anyFilled) {
    p.done = anyFilled;
    patchDoneState(pid, anyFilled);
  }
  updateMeta();
}

function patchDoneState(pid, isDone) {
  const el = document.querySelector(`.paper-item[data-pid="${CSS.escape(pid)}"]`);
  if (el) el.classList.toggle("done", isDone);
}

function setSaveBtn(state) {
  const btn = document.getElementById("save-btn"); if (!btn) return;
  btn.classList.remove("saved", "dirty");
  if      (state === "saved") { btn.textContent = "Saved ✓"; btn.classList.add("saved"); }
  else if (state === "dirty") { btn.textContent = "● Save";  btn.classList.add("dirty"); }
  else                        { btn.textContent = "Save"; }
}

function showStatus(msg) {
  const el = document.getElementById("status-msg");
  el.textContent = msg;
  clearTimeout(statusTimer);
  statusTimer = setTimeout(() => { el.textContent = ""; }, 2200);
}

/* ═══════════════════════════════════════════════════
   EXPORT / DOWNLOAD
═══════════════════════════════════════════════════ */
function exportCSV()  { window.location.href = "/api/export-csv"; }
function openGuide() { window.open("/guide", "_blank"); }

/* ═══════════════════════════════════════════════════
   KEYBOARD NAV
═══════════════════════════════════════════════════ */
document.addEventListener("keydown", e => {
  const tag = document.activeElement?.tagName;
  if (tag === "INPUT" || tag === "TEXTAREA" || tag === "SELECT") return;
  if      (e.key === "ArrowRight" || e.key === "j") { e.preventDefault(); selectPaper(curIdx + 1); }
  else if (e.key === "ArrowLeft"  || e.key === "k") { e.preventDefault(); selectPaper(curIdx - 1); }
  else if (e.key === "s" || e.key === "S")          { saveNow(); }
});

/* ═══════════════════════════════════════════════════
   FIELD TOOLTIP
═══════════════════════════════════════════════════ */
const _tip = document.createElement("div");
_tip.id = "field-tip";
document.body.appendChild(_tip);

function showTip(el) {
  const text = el.dataset.tip;
  if (!text) return;
  _tip.textContent = text;
  _tip.style.display = "block";
  const r = el.getBoundingClientRect();
  let left = r.left;
  let top  = r.bottom + 5;
  _tip.style.left = left + "px";
  _tip.style.top  = top + "px";
  // Clamp to viewport edges
  const tr = _tip.getBoundingClientRect();
  if (tr.right > window.innerWidth - 8)
    _tip.style.left = Math.max(8, window.innerWidth - 8 - tr.width) + "px";
  if (tr.bottom > window.innerHeight - 8)
    _tip.style.top  = (r.top - tr.height - 5) + "px";
}

function hideTip() { _tip.style.display = "none"; }

document.addEventListener("scroll", hideTip, true);
document.addEventListener("click",  hideTip);

/* ═══════════════════════════════════════════════════
   UTILS
═══════════════════════════════════════════════════ */
function esc(s) {
  return String(s ?? "")
    .replace(/&/g, "&amp;").replace(/"/g, "&quot;")
    .replace(/</g, "&lt;").replace(/>/g, "&gt;");
}

init();
</script>
